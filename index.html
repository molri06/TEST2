<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Canvas Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="viewport">
    <div id="world"></div>
  </div>

  <div id="banner">
    <dl>
      <div><dt>노트 만들기</dt><dd>빈 곳 <kbd>더블클릭</kbd></dd></div>
      <div><dt>옮기기</dt><dd>노트 테두리 <kbd>드래그</kbd></dd></div>
      <div><dt>이미지</dt><dd>파일을 캔버스에 <kbd>끌어다 놓기</kbd></dd></div>
      <div><dt>노트 안에서 찾기</dt><dd><kbd>Ctrl</kbd>+<kbd>F</kbd></dd></div>
      <div><dt>웹 검색</dt><dd>노트 왼쪽 위 <kbd>돋보기</kbd></dd></div>
      <div><dt>삭제</dt><dd>선택 후 <kbd>Backspace</kbd></dd></div>
      <div><dt>확대·축소</dt><dd><kbd>휠</kbd> · 이동은 빈 곳 드래그</dd></div>
    </dl>
    <button id="banner-close" type="button" title="닫기">✕</button>
  </div>

  <div id="bar">
    <span id="zoom">100%</span>
    <button id="help" type="button">사용법</button>
    <button id="typing-open" type="button">타자 연습</button>
    <button id="search-open" type="button">검색</button>
    <button id="reset" type="button">화면 맞추기</button>
  </div>

  <div id="search" hidden>
    <div class="head">
      <input id="query" type="search" placeholder="검색할 내용" autocomplete="off" spellcheck="false">
      <button id="search-close" type="button" title="닫기 (Esc)">✕</button>
    </div>
    <p id="search-status"></p>
    <ul id="results"></ul>
  </div>

  <div id="typing" hidden>
    <section class="game" role="dialog" aria-modal="true" aria-labelledby="typing-title">
      <header>
        <h2 id="typing-title">타자 연습</h2>
        <p id="typing-source"></p>
        <button id="typing-close" type="button" title="닫기 (Esc)">✕</button>
      </header>

      <label id="typing-pick">
        <span>연습할 노랫말</span>
        <select id="typing-song"></select>
      </label>

      <div id="ice" style="--melt: 0">
        <div class="chest">
          <svg viewBox="0 0 120 88" aria-hidden="true">
            <ellipse cx="60" cy="80" rx="42" ry="6" fill="#cccadf" opacity=".5"/>
            <path d="M22 40a38 30 0 0 1 76 0z" fill="#58a8a3"/>
            <path d="M22 40h76v30a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z" fill="#fddcc2"/>
            <rect x="52" y="32" width="16" height="22" rx="3" fill="#fbf6d0"/>
            <circle cx="60" cy="43" r="3.4" fill="#58a8a3"/>
            <path d="M22 40h76" stroke="#fbb3ab" stroke-width="3"/>
            <circle cx="38" cy="60" r="4" fill="#fbb3ab"/>
            <circle cx="82" cy="60" r="4" fill="#acd3e2"/>
            <circle cx="60" cy="66" r="3" fill="#cccadf"/>
          </svg>
          <span class="sparkle s1">✦</span>
          <span class="sparkle s2">✦</span>
          <span class="sparkle s3">✦</span>
        </div>

        <div class="frost">
          <span class="crack c1"></span>
          <span class="crack c2"></span>
          <span class="crack c3"></span>
        </div>

        <span class="edge"></span>
        <span class="drop d1"></span>
        <span class="drop d2"></span>
        <span class="drop d3"></span>

        <p id="ice-label">얼음 속에 무언가 있습니다</p>
      </div>

      <p id="typing-target" class="target" aria-live="polite"></p>
      <input id="typing-input" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="위 문장을 그대로 입력하세요">

      <dl id="typing-stats">
        <div><dt>타수</dt><dd id="stat-cpm">0</dd></div>
        <div><dt>정확도</dt><dd id="stat-acc">100%</dd></div>
        <div><dt>진행</dt><dd id="stat-progress">0 / 0</dd></div>
        <div><dt>최고 기록</dt><dd id="stat-best">—</dd></div>
      </dl>

      <p id="typing-result" hidden></p>
      <button id="typing-restart" type="button">다시 시작</button>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
